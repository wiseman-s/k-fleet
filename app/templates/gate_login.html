<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-FLEET Gate Login</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            padding: 36px 28px;
            border-radius: 14px;
            max-width: 420px;
            width: 100%;
            border-left: 6px solid #22c55e;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 4px;
            text-align: center;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            margin-bottom: 28px;
        }
        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            border: 2px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 18px;
            font-family: inherit;
            text-align: center;
            letter-spacing: 2px;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            margin-top: 24px;
            padding: 18px 24px;
            background: #22c55e;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
        }
        button:hover { background: #16a34a; }
        .error {
            background: #991b1b;
            color: #fecaca;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
            font-weight: 600;
        }
        .footer {
            color: #64748b;
            font-size: 12px;
            text-align: center;
            margin-top: 28px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>K-FLEET GATE</h1>
        <div class="subtitle">Vehicle Movement Control</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/gate/login">
            <label>Gate Code</label>
            <input type="text" name="gate_code" required autofocus autocomplete="off" placeholder="GATE-UT-01" style="text-transform: uppercase;">

            <label>Password</label>
            <input type="password" name="password" required autocomplete="current-password" style="letter-spacing: 0; font-size: 16px;">

            <button type="submit">Sign In</button>
        </form>

        <div class="footer">Contact ICT if you cannot access your gate account.</div>
    </div>
</body>
</html>
