<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — K-FLEET</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #1e293b;
            padding: 40px 32px;
            border-radius: 14px;
            max-width: 400px;
            width: 100%;
            border-left: 6px solid #22c55e;
        }
        h1 { font-size: 22px; margin-bottom: 6px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 28px; }
        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 15px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #3b82f6; }
        button {
            margin-top: 24px;
            padding: 12px 24px;
            background: #22c55e;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #16a34a; }
        .error {
            background: #991b1b;
            color: #fecaca;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .footer { color: #64748b; font-size: 12px; text-align: center; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>K-FLEET SECURE</h1>
        <div class="subtitle">KenGen Fleet Movement &amp; Security</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/login">
            <label>Staff Number</label>
            <input type="text" name="staff_number" required autofocus autocomplete="username" placeholder="e.g. KGN7700">

            <label>Password</label>
            <input type="password" name="password" required autocomplete="current-password">

            <button type="submit">Sign In</button>
        </form>

        <div class="footer">Contact ICT if you cannot access your account.</div>
    </div>
</body>
</html>
