<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Vehicle Request — K-FLEET</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f172a; color: #e2e8f0; padding: 24px;
        }
        .container { max-width: 640px; margin: 0 auto; background: #1e293b; padding: 32px; border-radius: 12px; }
        h1 { margin-bottom: 6px; font-size: 22px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .info-box {
            background: #0f172a; border-left: 3px solid #3b82f6;
            padding: 12px 16px; border-radius: 6px; margin-bottom: 24px;
            color: #94a3b8; font-size: 13px; line-height: 1.5;
        }
        label {
            display: block; margin-top: 16px; margin-bottom: 6px;
            color: #94a3b8; font-size: 13px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        input, select, textarea {
            width: 100%; padding: 10px 12px; border-radius: 6px;
            border: 1px solid #334155; background: #0f172a;
            color: #e2e8f0; font-size: 14px; font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: #3b82f6;
        }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        button {
            margin-top: 28px; padding: 12px 24px; background: #22c55e;
            color: #0f172a; border: none; border-radius: 6px;
            font-weight: 700; font-size: 15px; cursor: pointer; width: 100%;
        }
        button:hover { background: #16a34a; }
        .back {
            display: inline-block; margin-top: 16px; color: #94a3b8;
            text-decoration: none; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>New Vehicle Request</h1>
        <div class="subtitle">Submit a request for a vehicle from the Transport department.</div>

        <div class="info-box">
            <strong>Note:</strong> You are requesting a vehicle, not choosing one.
            Transport will assign the vehicle and driver based on availability.
        </div>

        <form method="POST" action="/journeys/create-page">
            {% if redirect_to %}<input type="hidden" name="redirect_to" value="{{ redirect_to }}">{% endif %}

            <label>Requesting Department</label>
            <select name="requesting_department_id" required>
                {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% endfor %}
            </select>

            <div class="row">
                <div>
                    <label>Requested By (Name)</label>
                    <input type="text" name="requested_by_name" required placeholder="e.g. Alice Wanjiku">
                </div>
                <div>
                    <label>Staff Number</label>
                    <input type="text" name="requested_by_staff_number" placeholder="e.g. KGN5001">
                </div>
            </div>

            <label>Origin Station</label>
            <select name="origin_station_id" required>
                {% for s in stations %}
                <option value="{{ s.id }}">{{ s.name }}</option>
                {% endfor %}
            </select>

            <label>Destination</label>
            <input type="text" name="destination" required placeholder="e.g. Wanjii, Nairobi, Supplier XYZ">

            <label>Purpose</label>
            <textarea name="purpose" rows="3" required placeholder="e.g. Deliver ICT equipment to Wanjii office"></textarea>

            <label>Priority</label>
            <select name="priority">
                <option value="normal">Normal</option>
                <option value="urgent">Urgent</option>
            </select>

            <div class="row">
                <div>
                    <label>Expected Departure</label>
                    <input type="datetime-local" name="expected_departure" required>
                </div>
                <div>
                    <label>Expected Return</label>
                    <input type="datetime-local" name="expected_return" required>
                </div>
            </div>

            <button type="submit">Submit Request</button>
        </form>

        <a href="{{ redirect_to or '/dashboard' }}" class="back">← Back</a>
    </div>
</body>
</html>
