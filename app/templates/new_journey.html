<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Journey Request — K-FLEET</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 24px;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
            background: #1e293b;
            padding: 32px;
            border-radius: 12px;
        }
        h1 { margin-bottom: 8px; font-size: 22px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 14px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3b82f6;
        }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        button {
            margin-top: 28px;
            padding: 12px 24px;
            background: #22c55e;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #16a34a; }
        .back {
            display: inline-block;
            margin-top: 16px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }
        .back:hover { color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>New Journey Request</h1>
        <div class="subtitle">Request a vehicle from Transport for an official journey.</div>

        <form method="POST" action="/journeys/create-page">
            <label>Vehicle</label>
            <select name="vehicle_id" required>
                {% for v in vehicles %}
                <option value="{{ v.id }}">{{ v.registration_number }} — {{ v.make or "" }} {{ v.model or "" }}</option>
                {% endfor %}
            </select>

            <label>Driver</label>
            <select name="driver_id" required>
                {% for d in drivers %}
                <option value="{{ d.id }}">{{ d.full_name }} ({{ d.staff_number }})</option>
                {% endfor %}
            </select>

            <label>Requesting Department</label>
            <select name="requesting_department_id" required>
                {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }}</option>
                {% endfor %}
            </select>

            <div class="row">
                <div>
                    <label>Requested By (Name)</label>
                    <input type="text" name="requested_by_name" required placeholder="e.g. Alice Wanjiku">
                </div>
                <div>
                    <label>Staff Number</label>
                    <input type="text" name="requested_by_staff_number" placeholder="e.g. KGN5001">
                </div>
            </div>

            <label>Origin Station</label>
            <select name="origin_station_id" required>
                {% for s in stations %}
                <option value="{{ s.id }}">{{ s.name }}</option>
                {% endfor %}
            </select>

            <label>Destination</label>
            <input type="text" name="destination" required placeholder="e.g. Wanjii, Nairobi, Supplier XYZ">

            <label>Purpose</label>
            <textarea name="purpose" rows="3" required placeholder="e.g. Deliver ICT equipment to Wanjii office"></textarea>

            <label>Priority</label>
            <select name="priority">
                <option value="normal">Normal</option>
                <option value="urgent">Urgent</option>
            </select>

            <div class="row">
                <div>
                    <label>Expected Departure</label>
                    <input type="datetime-local" name="expected_departure" required>
                </div>
                <div>
                    <label>Expected Return</label>
                    <input type="datetime-local" name="expected_return" required>
                </div>
            </div>

            <button type="submit">Submit Journey Request</button>
        </form>

        <a href="/dashboard" class="back">← Back to Dashboard</a>
    </div>
</body>
</html>
