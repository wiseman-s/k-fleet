<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Driver — K-FLEET</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
        .container { max-width: 640px; margin: 0 auto; background: #1e293b; padding: 32px; border-radius: 12px; }
        h1 { margin-bottom: 8px; font-size: 22px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        label { display: block; margin-top: 16px; margin-bottom: 6px; color: #94a3b8; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 10px 12px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #e2e8f0; font-size: 14px; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .checkbox-row { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
        .checkbox-row input { width: auto; }
        .checkbox-row label { margin: 0; text-transform: none; font-size: 14px; font-weight: 400; color: #e2e8f0; letter-spacing: 0; }
        button { margin-top: 28px; padding: 12px 24px; background: #22c55e; color: #0f172a; border: none; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; }
        button:hover { background: #16a34a; }
        .back { display: inline-block; margin-top: 16px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back:hover { color: #e2e8f0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add Driver</h1>
        <div class="subtitle">Register a new driver in the transport fleet.</div>

        <form method="POST" action="/drivers/add-page">
            <div class="row">
                <div>
                    <label>Staff Number</label>
                    <input type="text" name="staff_number" required placeholder="e.g. KGN7700">
                </div>
                <div>
                    <label>Phone</label>
                    <input type="text" name="phone" placeholder="e.g. 0722000001">
                </div>
            </div>

            <label>Full Name</label>
            <input type="text" name="full_name" required placeholder="e.g. John Munyua">

            <div class="row">
                <div>
                    <label>Employment Type</label>
                    <select name="employment_type">
                        <option value="permanent">Permanent</option>
                        <option value="contract">Contract</option>
                    </select>
                </div>
                <div>
                    <label>Duty Station</label>
                    <select name="duty_station_id" required>
                        {% for s in stations %}
                        <option value="{{ s.id }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="row">
                <div>
                    <label>License Number</label>
                    <input type="text" name="license_number" placeholder="e.g. DL-123456">
                </div>
                <div>
                    <label>License Expiry</label>
                    <input type="date" name="license_expiry">
                </div>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" id="is_supervisor" name="is_supervisor" value="true">
                <label for="is_supervisor">This driver is a supervisor (can approve journeys)</label>
            </div>

            <button type="submit">Save Driver</button>
        </form>

        <a href="/dashboard" class="back">← Back to Dashboard</a>
    </div>
</body>
</html>
