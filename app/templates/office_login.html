<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-FLEET — Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #0b1220;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            background: #131c31;
            padding: 48px 40px;
            border-radius: 16px;
            max-width: 440px;
            width: 100%;
            border-top: 4px solid #22c55e;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .brand {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #f8fafc;
            margin-bottom: 6px;
        }
        .brand .sub {
            color: #64748b;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .role-line {
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 32px;
            padding-bottom: 24px;
            border-bottom: 1px solid #1e293b;
        }
        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1.5px solid #243047;
            background: #0b1220;
            color: #e2e8f0;
            font-size: 16px;
            font-family: inherit;
            transition: border-color 0.15s;
        }
        input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        button {
            margin-top: 28px;
            padding: 15px 24px;
            background: #22c55e;
            color: #0b1220;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: background 0.15s;
        }
        button:hover { background: #16a34a; }
        .error {
            background: #7f1d1d;
            color: #fecaca;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 14px;
            text-align: center;
            border-left: 4px solid #ef4444;
        }
        .footer {
            color: #475569;
            font-size: 12px;
            text-align: center;
            margin-top: 32px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <h1>K-FLEET SECURE</h1>
            <div class="sub">KenGen Fleet Movement &amp; Security</div>
        </div>

        <div class="role-line">Sign in to the office system</div>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/auth/login">
            <label>Staff Number</label>
            <input type="text" name="staff_number" required autofocus autocomplete="username" placeholder="e.g. KGN0001">

            <label>Password</label>
            <input type="password" name="password" required autocomplete="current-password">

            <button type="submit">Sign In</button>
        </form>

        <div class="footer">
            Authorized KenGen staff only.<br>
            Contact ICT if you cannot access your account.
        </div>
    </div>
</body>
</html>
